name: Release check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -r requirements.txt
      - run: npm --prefix web ci
      - run: make check PYTHON=python
      - run: make eval-fixture PYTHON=python ARGS="--cache $RUNNER_TEMP/replay.sqlite --output $RUNNER_TEMP/replay.json"
      - run: PRECEDENT_STATIC_DEMO=1 make build
      - run: cp docs/demo.mp4 web/out/walkthrough.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: precedent-recorded-demo
          path: web/out/
          if-no-files-found: error

  pages-build:
    if: github.ref == 'refs/heads/main' && github.event.repository.has_pages && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      artifact: ${{ steps.artifact.outputs.name }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm --prefix web ci
      - run: PRECEDENT_STATIC_DEMO=1 make build
        env:
          PRECEDENT_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - run: cp docs/demo.mp4 web/out/walkthrough.mp4
      - id: artifact
        run: echo "name=github-pages-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: web/out/

  pages:
    needs: [verify, pages-build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          artifact_name: ${{ needs.pages-build.outputs.artifact }}
